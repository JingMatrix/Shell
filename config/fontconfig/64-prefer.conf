<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Carried over from imt.xyz:~/.config/fontconfig/conf.d/64-prefer.conf.

  Without it, a request for generic "sans-serif" or "monospace" with CJK text
  resolves per-glyph by fontconfig's own ordering, which on a box with 600+
  Noto faces is effectively arbitrary. This pins the Latin face first and the
  CJK face as the fallback behind it, so mixed Chinese/Latin runs keep one
  consistent pair.

  imt also had 09-Directories.conf and 78-Reject.conf; both were empty
  <fontconfig/> stubs written by Font Manager and are not reproduced.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK JP</family>
    </prefer>
  </alias>
</fontconfig>
