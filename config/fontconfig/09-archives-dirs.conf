<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Make fontconfig scan ~/Archives/Fonts.

  Fonts migrated off imt.xyz live here rather than in ~/.local/share/fonts so
  they sit with the rest of the archived material (Android, Dictionary) and are
  obviously not distro-managed. fontconfig scans no such path by default, so
  without this file every family below is invisible and fc-match silently
  degrades to Noto Sans; fontconfig always answers a query, so a missing
  family looks like a working one.

  What is in there, and why it is not just reinstallable:
    open-chinese-fonts/  Kai/楷体, Song/宋体, Hei/黑体, FangSong/仿宋.
                         terminal/kitty.conf maps CJK to "Kai" via symbol_map,
                         and this is the only thing that defines that family.
                         Reproducible: AUR open-chinese-fonts 20200109-1, whose
                         PKGBUILD pulls a GitHub release asset with a pinned
                         sha256. Kept as a local cache so the mapping does not
                         depend on a 2020 release URL staying up.
    华文字体/            STKaiti, STXingkai, STZhongsong, STFangsong, STXihei,
                         STCaiyun, STHupo, STLiti, STXinwei + 微软雅黑. Loose
                         files, no upstream, no git remote (checked on imt).
    方正字体/            方正书宋简体 (FZShuSong-Z01S). Same: unique files.
    Aptos/               Microsoft's Office default. Same.

  Deliberately NOT migrated: imt's ~/.local/share/fonts/.local/share/fonts/Hack
  (16 Nerd Font files, a doubly-nested extraction accident). This host has them
  from the ttf-hack-nerd package; a second copy would duplicate the family name
  "Hack Nerd Font" and make which file wins nondeterministic.
-->
<fontconfig>
  <dir>~/Archives/Fonts</dir>
</fontconfig>
